[package]
name = "lumi"
version = "0.2.0"
edition = "2021"
description = "Lumi — a hybrid Mamba-3 language model trainer and inference"

[features]
default = ["cpu"]
cpu = []
# Umbrella for "a GPU backend is compiled in". All GPU-side Rust is gated on
# this, so backend selection is confined to build.rs and the runtime FFI names.
gpu = ["lumi-kernels/gpu"]
cuda = ["gpu", "lumi-kernels/cuda"] # NVIDIA backend, kernels from csrc_cuda/ (retained, not active)
hip = ["gpu", "lumi-kernels/hip"]  # AMD/ROCm backend, kernels from csrc_hip/

[dependencies]
lumi-kernels = { path = "../kernels" }
tokenizers = "0.20"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
clap = { version = "4", features = ["derive"] }

[dev-dependencies]
tempfile = "3"
